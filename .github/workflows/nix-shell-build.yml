name: build and test Bitcoin Core with the nix-shell

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        nixos-version: [ "nixos-24.11", "nixos-unstable" ]
        bitcoin-ref: [ "master", "v29.0" ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:${{ matrix.nixos-version }}
    - name: Checkout Bitcoin Core
      uses: actions/checkout@v4
      with:
        repository: bitcoin/bitcoin
        ref: ${{ matrix.bitcoin-ref }}
        path: bitcoin
    - name: Build with dev flake
      run: nix develop --command "cd bitcoin && cmake -B build && cmake --build build --parallel"
    - name: Run unit tests with nix-shell
      run: nix develop --command "cd bitcoin && ctest --test-dir build --parallel"
    - name: Run functional tests with nix-shell
      run: nix develop --command "cd bitcoin && python3 build/test/functional/test_runner.py -j4 --tmpdir ${{ github.workspace}}/test"
